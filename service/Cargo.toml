[package]
name = "marending-dev"
version = "0.2.86"
edition = "2021"

[dependencies]
axum = "0.8.9"
dotenv = "0.15.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["catch-panic", "fs", "set-header"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
